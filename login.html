
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - P&L BIKE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .acceso-opcion {
            cursor: pointer;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 16px 10px;
            height: 100%;
            transition: all 0.2s ease;
        }

        .acceso-opcion:hover {
            border-color: var(--pl-pine);
            background-color: rgba(31, 111, 84, 0.04);
        }

        .acceso-opcion:has(input:checked) {
            border-color: var(--pl-pine);
            background-color: rgba(31, 111, 84, 0.09);
        }

        .acceso-opcion input {
            accent-color: var(--pl-pine);
        }

        .acceso-icono {
            font-size: 2rem;
            color: var(--pl-pine);
        }
    </style>

</head>

<body class="bg-light">

    <div class="fondo-bicis" id="fondoBicis"></div>

    <div class="container">

        <div class="row justify-content-center mt-5 mb-5">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h2 class="text-center text-success mb-2">
                            🚲 P&L BIKE
                        </h2>

                        <h5 class="text-center mb-4">
                            Iniciar sesión
                        </h5>


                        <!-- SELECCIÓN DEL TIPO DE ACCESO -->

                        <p class="text-center fw-semibold mb-3">
                            ¿Cómo querés ingresar?
                        </p>

                        <div class="row g-3 mb-4">

                            <!-- CLIENTE -->

                            <div class="col-6">

                                <label class="acceso-opcion d-block text-center">

                                    <input
                                        type="radio"
                                        name="tipoAcceso"
                                        value="usuario"
                                        checked
                                        class="form-check-input mb-2">

                                    <div class="acceso-icono">
                                        <i class="bi bi-person-circle"></i>
                                    </div>

                                    <div class="fw-bold">
                                        Cliente
                                    </div>

                                    <small class="text-muted">
                                        Alquileres y viajes
                                    </small>

                                </label>

                            </div>


                            <!-- ADMINISTRADOR -->

                            <div class="col-6">

                                <label class="acceso-opcion d-block text-center">

                                    <input
                                        type="radio"
                                        name="tipoAcceso"
                                        value="admin"
                                        class="form-check-input mb-2">

                                    <div class="acceso-icono">
                                        <i class="bi bi-shield-lock"></i>
                                    </div>

                                    <div class="fw-bold">
                                        Administrador
                                    </div>

                                    <small class="text-muted">
                                        Gestión del sistema
                                    </small>

                                </label>

                            </div>

                        </div>


                        <!-- FORMULARIO -->

                        <div class="mb-3">

                            <label for="loginEmail" class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="loginEmail"
                                class="form-control"
                                placeholder="Ingresá tu correo">

                        </div>


                        <div class="mb-3">

                            <label for="loginPassword" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="loginPassword"
                                class="form-control"
                                placeholder="Ingresá tu contraseña">

                        </div>


                        <p class="text-end mb-3">

                            <a href="recuperar-password.html" class="text-success">
                                ¿Olvidaste tu contraseña?
                            </a>

                        </p>


                        <button
                            class="btn btn-success w-100"
                            onclick="login()">

                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Ingresar

                        </button>


                        <p class="text-center mt-3 mb-0">

                            ¿No tenés cuenta?

                            <a href="registro.html">
                                Registrate
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- MODAL DE BIENVENIDA -->

    <div class="modal fade" id="welcomeModal" tabindex="-1"
         data-bs-backdrop="static" data-bs-keyboard="false">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow-lg text-center"
                 style="border-radius: 22px; overflow: hidden;">

                <div class="modal-body p-5">

                    <div class="d-flex justify-content-center mb-4">

                        <div class="d-flex align-items-center justify-content-center
                                    bg-success bg-opacity-10 rounded-circle"
                             style="width: 90px; height: 90px;">

                            <span style="font-size: 48px;">🚲</span>

                        </div>

                    </div>

                    <h3 class="fw-bold mb-2" style="color: #198754;">
                        ¡Hola, <span id="welcomeName">Usuario</span>!
                    </h3>

                    <p class="text-secondary mb-4">
                        Nos alegra tenerte de vuelta.
                        ¡Prepará tu próximo recorrido!
                    </p>

                    <div class="d-flex justify-content-center align-items-center gap-2">

                        <span class="spinner-border spinner-border-sm text-success"
                              role="status"></span>

                        <small class="text-secondary">
                            Ingresando a P&L BIKE...
                        </small>

                    </div>

                </div>

                <div style="height: 6px; background-color: #198754;"></div>

            </div>

        </div>

    </div>


    <!-- MODAL DE MENSAJES -->

    <div class="modal fade" id="messageModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header" id="messageHeader">

                    <h5 class="modal-title w-100 text-center" id="messageTitle"></h5>

                    <button
                        id="messageClose"
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body text-center">

                    <p id="messageText" class="mb-0"></p>

                </div>

                <div class="modal-footer" id="messageFooter">

                    <button
                        class="btn btn-primary"
                        data-bs-dismiss="modal">

                        Aceptar

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

</body>

</html>
