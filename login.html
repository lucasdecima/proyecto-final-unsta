<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Login - P&L BIKE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

    <div class="fondo-bicis" id="fondoBicis"></div>

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-5">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center text-success mb-4">
🚲 P&L BIKE
</h2>

<h5 class="text-center mb-4">
Iniciar Sesión
</h5>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="loginEmail"
class="form-control">

</div>

<div class="mb-3">

<label>Contraseña</label>

<input
type="password"
id="loginPassword"
class="form-control">

</div>

<p class="text-end mb-3">
    <a href="recuperar-password.html" class="text-success">
        ¿Olvidaste tu contraseña?
    </a>
</p>

<button
class="btn btn-success w-100"
onclick="login()">

Ingresar

</button>

<p class="text-center mt-3">

¿No tenés cuenta?

<a href="registro.html">

Registrate

</a>

</p>

</div>

</div>

</div>

</div>

</div>


<!-- Modal exclusivo de bienvenida -->
<div class="modal fade" id="welcomeModal" tabindex="-1"
     data-bs-backdrop="static" data-bs-keyboard="false">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg text-center"
             style="border-radius: 22px; overflow: hidden;">

            <div class="modal-body p-5">

                <div class="d-flex justify-content-center mb-4">
                    <div class="d-flex align-items-center justify-content-center
                                bg-success bg-opacity-10 rounded-circle"
                         style="width: 90px; height: 90px;">

                        <span style="font-size: 48px;">🚲</span>

                    </div>
                </div>

                <h3 class="fw-bold mb-2" style="color: #198754;">
                    ¡Hola, <span id="welcomeName">Usuario</span>!
                </h3>

                <p class="text-secondary mb-4">
                    Nos alegra tenerte de vuelta.
                    ¡Prepará tu próximo recorrido!
                </p>

                <div class="d-flex justify-content-center align-items-center gap-2">
                    <span class="spinner-border spinner-border-sm text-success"
                          role="status"></span>

                    <small class="text-secondary">
                        Ingresando a P&L BIKE...
                    </small>
                </div>

            </div>

            <div style="height: 6px; background-color: #198754;"></div>

        </div>
    </div>
</div>




<!-- Modal de mensajes -->
<div class="modal fade" id="messageModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header" id="messageHeader">

                <h5 class="modal-title w-100 text-center" id="messageTitle"> </h5>

                <button
                    id = "messageClose" 
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

           <div class="modal-body text-center">
                <p id="messageText" class="mb-0"></p>

            </div>  

            <div class="modal-footer" id="messageFooter">

                <button
                    class="btn btn-primary"
                    data-bs-dismiss="modal">

                    Aceptar

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>

</body>

</html>
