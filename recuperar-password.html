<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - P&L BIKE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="fondo-bicis" id="fondoBicis"></div>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body">

                        <h2 class="text-center text-success mb-4">
                            🚲 P&L BIKE
                        </h2>

                        <h5 class="text-center mb-3">
                            Recuperar contraseña
                        </h5>

                        <p class="text-muted text-center">
                            Ingresá tu correo electrónico y te enviaremos
                            un enlace para restablecer tu contraseña.
                        </p>

                        <div class="mb-3">
                            <label for="emailRecuperacion" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="emailRecuperacion"
                                class="form-control"
                                placeholder="correo@ejemplo.com">
                        </div>

                        <button
                            type="button"
                            class="btn btn-success w-100"
                            onclick="solicitarRecuperacionPassword()">

                            Enviar enlace de recuperación

                        </button>

                        <p class="text-center mt-3 mb-0">
                            <a href="login.html" class="text-success">
                                Volver al inicio de sesión
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal de mensajes -->
    <div class="modal fade" id="messageModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header" id="messageHeader">
                    <h5 class="modal-title w-100 text-center" id="messageTitle"></h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body text-center">
                    <p id="messageText" class="mb-0"></p>
                </div>

                <div class="modal-footer" id="messageFooter">
                    <button class="btn btn-primary" data-bs-dismiss="modal">
                        Aceptar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>

</body>
</html>
