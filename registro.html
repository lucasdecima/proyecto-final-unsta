<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">
    
    <div class="fondo-bicis" id="fondoBicis"></div>

<div class="container">

<div class="row justify-content-center mt-5">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center text-success">
Crear cuenta
</h2>

<div class="mb-3">

    <label class="form-label">Nombre y apellido</label>

    <input
        id="nombre"
        class="form-control"
        placeholder="Ej.: Paula Barrionuevo">

    <small id="nombreLongitud" class="validacion">
        ✖ Entre 3 y 30 caracteres
    </small>

    <small id="nombreLetras" class="validacion">
        ✖ Solo letras y espacios
    </small>

</div>

<div class="mb-3">

    <label class="form-label">Email</label>

    <input
        id="email"
        type="email"
        class="form-control"
        placeholder="Ej.: paula@email.com">

    <small id="emailFormato" class="validacion">
        ✖ Debe tener formato usuario@dominio.com
    </small>

    <small id="emailExiste" class="validacion">
        ✖ Este correo ya está registrado
    </small>

</div>
<div class="mb-3">

    <label class="form-label">Contraseña</label>

    <input
        id="password"
        type="password"
        class="form-control"
        placeholder="Ingrese una contraseña">

    <small id="passLongitud" class="validacion">
        ✖ Mínimo 8 caracteres
    </small>

    <small id="passMayuscula" class="validacion">
        ✖ Al menos una mayúscula
    </small>

    <small id="passMinuscula" class="validacion">
        ✖ Al menos una minúscula
    </small>

    <small id="passNumero" class="validacion">
        ✖ Al menos un número
    </small>

</div>

<button
    id="btnRegistrar"
    class="btn btn-success w-100"
    onclick="registrar()"
    disabled>

    Registrarse

</button>

<p class="text-center mt-3">

¿Ya tenés cuenta?

<a href="login.html">

Iniciar sesión

</a>

</p>

</div>

</div>

</div>

</div>

</div>


<!-- Modal de mensajes -->
<div class="modal fade" id="messageModal" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header" id="messageHeader">

                <h5 class="modal-title" id="messageTitle">
                    Mensaje
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <p id="messageText"></p>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-primary"
                    data-bs-dismiss="modal">

                    Aceptar

                </button>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
